[program:cou-youth-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/cou-youth/artisan queue:work --sleep=3 --tries=3 --timeout=120
user=www-data
numprocs=2
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/cou-youth/storage/logs/worker.log
stopwaitsecs=3600
